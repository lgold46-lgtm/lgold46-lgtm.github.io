<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mason's Little Aid - Access Required</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --olive: #909180;
      --dark-brown: #372c21;
      --cream: #e0d4c3;
      --cream-light: #ede5d8;
      --white: #faf7f3;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: linear-gradient(135deg, var(--cream-light) 0%, var(--cream) 100%);
      color: var(--dark-brown);
      font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .password-container {
      background: var(--white);
      padding: 3rem;
      border-radius: 8px;
      box-shadow: 0 10px 40px rgba(55, 44, 33, 0.1);
      max-width: 400px;
      width: 100%;
      text-align: center;
    }

    .logo {
      margin-bottom: 2rem;
      font-size: 2rem;
    }

    h1 {
      font-size: 1.8rem;
      color: var(--dark-brown);
      margin-bottom: 0.5rem;
      font-weight: 600;
    }

    .subtitle {
      color: var(--olive);
      font-size: 0.95rem;
      margin-bottom: 2rem;
      opacity: 0.8;
    }

    .form-group {
      margin-bottom: 1.5rem;
      text-align: left;
    }

    label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--dark-brown);
      margin-bottom: 0.5rem;
    }

    input[type="password"] {
      width: 100%;
      padding: 0.8rem 1rem;
      border: 2px solid var(--cream);
      border-radius: 4px;
      font-family: inherit;
      font-size: 1rem;
      transition: border-color 0.3s;
    }

    input[type="password"]:focus {
      outline: none;
      border-color: var(--olive);
      box-shadow: 0 0 0 3px rgba(144, 145, 128, 0.1);
    }

    .button-group {
      display: flex;
      gap: 1rem;
      margin-top: 2rem;
    }

    button {
      flex: 1;
      padding: 0.8rem 1.5rem;
      border: none;
      border-radius: 4px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s;
      min-height: 44px;
    }

    .btn-submit {
      background: var(--olive);
      color: var(--white);
    }

    .btn-submit:hover {
      background: var(--dark-brown);
      transform: translateY(-2px);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    .error-message {
      color: #d32f2f;
      font-size: 0.85rem;
      margin-top: 1rem;
      padding: 0.75rem;
      background: rgba(211, 47, 47, 0.1);
      border-radius: 4px;
      display: none;
    }

    .error-message.show {
      display: block;
    }

    .info-text {
      font-size: 0.85rem;
      color: var(--olive);
      margin-top: 1.5rem;
      line-height: 1.6;
    }

    .status-indicator {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4caf50;
      margin-right: 0.5rem;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.5;
      }
    }

    @media (max-width: 480px) {
      .password-container {
        padding: 2rem;
      }

      h1 {
        font-size: 1.5rem;
      }

      .button-group {
        flex-direction: column;
      }
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&display=swap" rel="stylesheet">
</head>
<body>
  <div class="password-container">
    <div class="logo">🔐</div>
    <h1>Mason's Little Aid</h1>
    <p class="subtitle">Early Access - Beta Preview</p>

    <form id="passwordForm">
      <div class="form-group">
        <label for="password">Access Password</label>
        <input 
          type="password" 
          id="password" 
          placeholder="Enter password"
          autocomplete="off"
          required
        >
      </div>

      <div class="button-group">
        <button type="submit" class="btn-submit">Access Site</button>
      </div>

      <div class="error-message" id="errorMessage">
        Incorrect password. Please try again.
      </div>
    </form>

    <p class="info-text">
      <span class="status-indicator"></span>
      This site is in beta. Contact us for access.
    </p>
  </div>

  <script>
    // Configuration - Change this password in production!
    const SITE_PASSWORD = 'MasonsBeta2026'; // ← Change this to your password
    const PASSWORD_TOKEN = 'masons_beta_access';
    const TOKEN_EXPIRY = 30 * 24 * 60 * 60 * 1000; // 30 days in milliseconds

    // Check if user already has valid access token
    function checkAccessToken() {
      const token = localStorage.getItem(PASSWORD_TOKEN);
      const tokenTime = localStorage.getItem(PASSWORD_TOKEN + '_time');

      if (token && tokenTime) {
        const now = Date.now();
        const timePassed = now - parseInt(tokenTime);

        // If token is still valid, redirect to main site
        if (timePassed < TOKEN_EXPIRY) {
          window.location.href = 'index.html';
          return;
        }
      }

      // Token expired or doesn't exist
      localStorage.removeItem(PASSWORD_TOKEN);
      localStorage.removeItem(PASSWORD_TOKEN + '_time');
    }

    // Handle password submission
    document.getElementById('passwordForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const password = document.getElementById('password').value;
      const errorMessage = document.getElementById('errorMessage');

      if (password === SITE_PASSWORD) {
        // Password correct - set token and redirect
        localStorage.setItem(PASSWORD_TOKEN, 'true');
        localStorage.setItem(PASSWORD_TOKEN + '_time', Date.now().toString());

        // Brief success feedback
        errorMessage.classList.remove('show');
        document.querySelector('.btn-submit').textContent = 'Accessing...';
        document.querySelector('.btn-submit').disabled = true;

        // Redirect after brief delay
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 500);
      } else {
        // Password incorrect
        errorMessage.classList.add('show');
        document.getElementById('password').focus();
        document.getElementById('password').select();

        // Shake animation
        const container = document.querySelector('.password-container');
        container.style.animation = 'none';
        setTimeout(() => {
          container.style.animation = 'shake 0.3s';
        }, 10);
      }
    });

    // Shake animation
    const style = document.createElement('style');
    style.textContent = `
      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-10px); }
        75% { transform: translateX(10px); }
      }
    `;
    document.head.appendChild(style);

    // Check access on page load
    window.addEventListener('load', checkAccessToken);

    // Optional: Clear password from input on focus (security)
    document.getElementById('password').addEventListener('focus', function() {
      this.value = '';
    });
  </script>
</body>
</html>
